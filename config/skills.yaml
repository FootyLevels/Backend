skills:
  cruyff_turn:
    name: "Cruyff Turn"
    description: "Drag the ball behind your standing leg while turning 180°"
    difficulty: intermediate
    dominant_foot: right
    player_id: cruyff
    video_url: "skills/cruyff_turn_reference.mp4"
    thumbnail_url: "skills/cruyff_turn_thumb.jpeg"
    origin_story: "Johan Cruyff first performed this move against Sweden at the 1974 World Cup, changing football forever."

    phases:
      - name: approach
        description: "Running towards the ball/defender"
      - name: fake
        description: "Body feint suggesting pass/shot"
      - name: drag
        description: "Dragging ball behind standing leg"
      - name: turn
        description: "Rotating body 180°"
      - name: exit
        description: "Accelerating away"

  step_over:
    name: "Step Over"
    description: "Circular foot motion over the ball to fake a direction change"
    difficulty: beginner
    dominant_foot: right
    player_id: ronaldo
    video_url: "skills/step_over_reference.mp4"
    thumbnail_url: "skills/step_over_thumb.jpeg"
    origin_story: "While not invented by Ronaldo, CR7 made the step over his signature move, often doing multiple in succession."

    phases:
      - name: approach
        description: "Approaching the ball"
      - name: step_over
        description: "Circular motion of foot over ball"
      - name: push
        description: "Push ball in opposite direction"

  elastico:
    name: "Elastico (Flip Flap)"
    description: "Quick inside-outside touch to change direction"
    difficulty: advanced
    dominant_foot: right
    player_id: ronaldinho
    video_url: "skills/elastico_reference.mp4"
    thumbnail_url: "skills/elastico_thumb.jpeg"
    origin_story: "Made famous by Ronaldinho, the elastico became his signature move, leaving defenders mesmerized."

    phases:
      - name: approach
        description: "Approaching with ball"
      - name: outside_touch
        description: "Push ball with outside of foot"
      - name: inside_snap
        description: "Snap ball back with inside of foot"

  roulette:
    name: "Marseille Roulette"
    description: "360° spin while dragging the ball with both feet"
    difficulty: intermediate
    dominant_foot: right
    player_id: zidane
    video_url: "skills/roulette_reference.mp4"
    thumbnail_url: "skills/roulette_thumb.jpeg"
    origin_story: "Zidane made the roulette his trademark move, executing it with unmatched elegance in tight spaces."

    phases:
      - name: approach
        description: "Approaching the defender"
      - name: first_touch
        description: "Initial drag with strong foot"
      - name: spin
        description: "360° rotation"
      - name: second_touch
        description: "Complete with weak foot"
      - name: exit
        description: "Accelerate away"

  rainbow_flick:
    name: "Rainbow Flick"
    description: "Flick the ball over your head and the defender"
    difficulty: advanced
    dominant_foot: right
    player_id: neymar
    video_url: "skills/rainbow_flick_reference.mp4"
    thumbnail_url: "skills/rainbow_flick_thumb.jpeg"
    origin_story: "Neymar has made the rainbow flick his party piece, humiliating defenders with this audacious skill."

    phases:
      - name: setup
        description: "Position ball between feet"
      - name: roll_up
        description: "Roll ball up back of standing leg"
      - name: flick
        description: "Flick ball over head with heel"
      - name: collection
        description: "Collect ball on other side"

  la_croqueta:
    name: "La Croqueta"
    description: "Quick lateral ball shift from one foot to the other"
    difficulty: beginner
    dominant_foot: right
    player_id: messi
    video_url: "skills/la_croqueta_reference.mp4"
    thumbnail_url: "skills/la_croqueta_thumb.jpeg"
    origin_story: "Originally performed by Michael Laudrup, Iniesta and Messi made this simple but effective move famous."

    phases:
      - name: approach
        description: "Running with ball"
      - name: shift
        description: "Quick lateral pass to other foot"
      - name: acceleration
        description: "Burst past defender"

  chop:
    name: "The Chop"
    description: "Sharp cut behind standing leg to change direction"
    difficulty: beginner
    dominant_foot: right
    player_id: mbappe
    video_url: "skills/chop_reference.mp4"
    thumbnail_url: "skills/chop_thumb.jpeg"
    origin_story: "A fundamental skill, Mbappe uses the chop at high speed to devastating effect."

    phases:
      - name: approach
        description: "Running at pace"
      - name: plant
        description: "Plant standing foot"
      - name: cut
        description: "Chop ball behind standing leg"
      - name: exit
        description: "Accelerate in new direction"

  sombrero:
    name: "Sombrero Flick"
    description: "Chip the ball over an incoming opponent"
    difficulty: advanced
    dominant_foot: right
    player_id: ronaldinho
    video_url: "skills/sombrero_reference.mp4"
    thumbnail_url: "skills/sombrero_thumb.jpeg"
    origin_story: "Ronaldinho perfected the art of chipping the ball over defenders with joy and flair."

    phases:
      - name: approach
        description: "Defender approaching"
      - name: scoop
        description: "Scoop ball upward"
      - name: dodge
        description: "Move around defender"
      - name: collection
        description: "Collect ball on other side"

  heel_chop:
    name: "Heel Chop"
    description: "Use heel to knock ball behind standing leg"
    difficulty: intermediate
    dominant_foot: right
    player_id: maradona
    video_url: "skills/heel_chop_reference.mp4"
    thumbnail_url: "skills/heel_chop_thumb.jpeg"
    origin_story: "Maradona used this deceptive heel touch to wrong-foot defenders in tight spaces."

    phases:
      - name: approach
        description: "Running with ball"
      - name: plant
        description: "Plant standing foot"
      - name: heel_touch
        description: "Heel chop behind standing leg"
      - name: turn
        description: "Turn and accelerate"

# Skill categories for browsing
categories:
  - id: turns
    name: "Turns & Spins"
    skills: [cruyff_turn, roulette]
  - id: feints
    name: "Feints & Fakes"
    skills: [step_over, elastico, la_croqueta]
  - id: flicks
    name: "Flicks & Chips"
    skills: [rainbow_flick, sombrero, heel_chop]
  - id: cuts
    name: "Cuts & Chops"
    skills: [chop]

# Difficulty progression
progression:
  beginner:
    - step_over
    - la_croqueta
    - chop
  intermediate:
    - cruyff_turn
    - roulette
    - heel_chop
  advanced:
    - elastico
    - rainbow_flick
    - sombrero
