skills:
  cruyff_turn:
    name: "Cruyff Turn"
    description: "Drag the ball behind your standing leg while turning 180°"
    difficulty: intermediate
    dominant_foot: right
    player_id: cruyff
    video_url: "skills/cruyff_turn_reference.mp4"
    thumbnail_url: "skills/cruyff_turn_thumb.jpg"
    origin_story: "Johan Cruyff first performed this move against Sweden at the 1974 World Cup, changing football forever."

    phases:
      - name: approach
        description: "Running towards the ball/defender"
      - name: fake
        description: "Body feint suggesting pass/shot"
      - name: drag
        description: "Dragging ball behind standing leg"
      - name: turn
        description: "Rotating body 180°"
      - name: exit
        description: "Accelerating away"

    key_joints:
      - left_hip
      - right_hip
      - left_ankle
      - right_ankle
      - left_knee
      - right_knee
      - left_shoulder
      - right_shoulder

    checkpoints:
      - id: plant_foot_position
        name: "Plant Foot Position"
        description: "Standing foot should be close to the ball"
        phase: drag
        joints: [left_ankle]
        metric_type: distance
        ideal_value: 0.26
        threshold_good: 0.39
        threshold_acceptable: 0.51
        weight: 0.2
        feedback:
          good: "Great plant foot positioning!"
          acceptable: "Plant foot is okay, try to get it a bit closer to the ball"
          poor: "Keep your plant foot closer to the ball for better balance and control"

      - id: hip_rotation
        name: "Hip Rotation"
        description: "Hips should rotate fully during the turn"
        phase: turn
        joints: [left_hip, right_hip]
        metric_type: rotation_angle
        ideal_value: 166
        threshold_good: 148
        threshold_acceptable: 122
        weight: 0.3
        feedback:
          good: "Excellent hip rotation!"
          acceptable: "Good rotation, but try to turn your hips more completely"
          poor: "Rotate your hips more fully - aim for a complete 180° turn"

      - id: shoulder_deception
        name: "Shoulder Fake"
        description: "Shoulders should fake one direction before turning"
        phase: fake
        joints: [left_shoulder, right_shoulder]
        metric_type: direction_change
        ideal_value: 177
        threshold_good: 141
        threshold_acceptable: 106
        weight: 0.2
        feedback:
          good: "Great deception with your shoulders!"
          acceptable: "Nice fake, exaggerate the shoulder drop a bit more"
          poor: "Sell the move! Drop your shoulder in the fake direction first"

      - id: knee_bend
        name: "Knee Flexion"
        description: "Knees should be bent for balance and explosiveness"
        phase: drag
        joints: [left_knee, right_knee]
        metric_type: angle
        ideal_value: 30
        threshold_good: 35
        threshold_acceptable: 39
        weight: 0.15
        feedback:
          good: "Good knee bend for balance!"
          acceptable: "Bend your knees a bit more for better stability"
          poor: "Lower your center of gravity - bend your knees more"

      - id: exit_acceleration
        name: "Exit Speed"
        description: "Should accelerate quickly after completing the turn"
        phase: exit
        joints: [left_hip, right_hip]
        metric_type: velocity_change
        ideal_value: 0.78
        threshold_good: 0.62
        threshold_acceptable: 0.50
        weight: 0.15
        feedback:
          good: "Explosive exit - great acceleration!"
          acceptable: "Good exit, try to accelerate faster out of the turn"
          poor: "Burst out of the turn! The move is wasted without quick acceleration"

  step_over:
    name: "Step Over"
    description: "Circular foot motion over the ball to fake a direction change"
    difficulty: beginner
    dominant_foot: right
    player_id: ronaldo
    video_url: "skills/step_over_reference.mp4"
    thumbnail_url: "skills/step_over_thumb.jpg"
    origin_story: "While not invented by Ronaldo, CR7 made the step over his signature move, often doing multiple in succession."

    phases:
      - name: approach
        description: "Approaching the ball"
      - name: step_over
        description: "Circular motion of foot over ball"
      - name: push
        description: "Push ball in opposite direction"

    key_joints:
      - right_ankle
      - right_knee
      - right_hip
      - left_ankle
      - left_shoulder
      - right_shoulder

    checkpoints:
      - id: foot_arc
        name: "Foot Arc"
        description: "Stepping foot should make clean circular motion"
        phase: step_over
        joints: [right_ankle]
        metric_type: arc_completeness
        ideal_value: 1.0
        threshold_good: 0.8
        threshold_acceptable: 0.6
        weight: 0.35
        feedback:
          good: "Clean circular motion!"
          acceptable: "Good arc, try to make it more circular and complete"
          poor: "Make a fuller circle with your foot - don't cut the arc short"

      - id: body_lean
        name: "Body Lean"
        description: "Body should lean into the fake direction"
        phase: step_over
        joints: [left_shoulder, left_hip]
        metric_type: angle
        ideal_value: 15
        threshold_good: 10
        threshold_acceptable: 5
        weight: 0.25
        feedback:
          good: "Great body lean to sell the fake!"
          acceptable: "Lean into the fake a bit more"
          poor: "Use your body! Lean into the fake direction to deceive the defender"

      - id: speed_of_move
        name: "Move Speed"
        description: "Step over should be quick and sharp"
        phase: step_over
        joints: [right_ankle]
        metric_type: angular_velocity
        ideal_value: 500
        threshold_good: 400
        threshold_acceptable: 300
        weight: 0.25
        feedback:
          good: "Quick and sharp - perfect speed!"
          acceptable: "Good pace, try to be a bit quicker"
          poor: "Speed it up! A slow step over won't fool anyone"

      - id: exit_direction
        name: "Exit Direction"
        description: "Push ball in opposite direction of step over"
        phase: push
        joints: [left_ankle]
        metric_type: direction_angle
        ideal_value: 90
        threshold_good: 70
        threshold_acceptable: 50
        weight: 0.15
        feedback:
          good: "Perfect direction change!"
          acceptable: "Good push, try to go more opposite to your fake"
          poor: "Push the ball in the opposite direction of your step over"

  elastico:
    name: "Elastico (Flip Flap)"
    description: "Quick inside-outside touch to change direction"
    difficulty: advanced
    dominant_foot: right
    player_id: ronaldinho
    video_url: "skills/elastico_reference.mp4"
    thumbnail_url: "skills/elastico_thumb.jpg"
    origin_story: "Made famous by Ronaldinho, the elastico became his signature move, leaving defenders mesmerized."

    phases:
      - name: approach
        description: "Approaching with ball"
      - name: outside_touch
        description: "Push ball with outside of foot"
      - name: inside_snap
        description: "Snap ball back with inside of foot"

    key_joints:
      - right_ankle
      - right_knee
      - right_foot_index

    checkpoints:
      - id: single_motion
        name: "Fluid Motion"
        description: "Both touches should be one continuous motion"
        phase: [outside_touch, inside_snap]
        joints: [right_ankle]
        metric_type: motion_continuity
        ideal_value: 1.0
        threshold_good: 0.8
        threshold_acceptable: 0.6
        weight: 0.4
        feedback:
          good: "Beautifully fluid motion!"
          acceptable: "Good flow, try to make it more seamless"
          poor: "Make it one smooth motion - don't pause between touches"

      - id: ankle_rotation
        name: "Ankle Flexibility"
        description: "Quick ankle rotation between outside and inside"
        phase: inside_snap
        joints: [right_ankle]
        metric_type: rotation_speed
        ideal_value: 800
        threshold_good: 600
        threshold_acceptable: 400
        weight: 0.35
        feedback:
          good: "Incredible ankle speed!"
          acceptable: "Good rotation, work on snapping it faster"
          poor: "Snap your ankle quicker - the elastico needs fast rotation"

      - id: ball_control
        name: "Ball Proximity"
        description: "Ball should stay close to foot throughout"
        phase: [outside_touch, inside_snap]
        joints: [right_foot_index]
        metric_type: consistency
        ideal_value: 0.1
        threshold_good: 0.15
        threshold_acceptable: 0.25
        weight: 0.25
        feedback:
          good: "Great close control!"
          acceptable: "Keep the ball a bit closer to your foot"
          poor: "The ball is getting away from you - keep it tighter"

  roulette:
    name: "Marseille Roulette"
    description: "360° spin while dragging the ball with both feet"
    difficulty: intermediate
    dominant_foot: right
    player_id: zidane
    video_url: "skills/roulette_reference.mp4"
    thumbnail_url: "skills/roulette_thumb.jpg"
    origin_story: "Zidane made the roulette his trademark move, executing it with unmatched elegance in tight spaces."

    phases:
      - name: approach
        description: "Approaching the defender"
      - name: first_touch
        description: "Initial drag with strong foot"
      - name: spin
        description: "360° rotation"
      - name: second_touch
        description: "Complete with weak foot"
      - name: exit
        description: "Accelerate away"

    key_joints:
      - left_hip
      - right_hip
      - left_ankle
      - right_ankle
      - left_shoulder
      - right_shoulder

    checkpoints:
      - id: spin_completeness
        name: "Full Rotation"
        description: "Complete 360° spin without losing balance"
        phase: spin
        joints: [left_hip, right_hip]
        metric_type: rotation_angle
        ideal_value: 360
        threshold_good: 330
        threshold_acceptable: 300
        weight: 0.35
        feedback:
          good: "Perfect full rotation!"
          acceptable: "Good spin, try to complete the full 360°"
          poor: "Commit to the full turn - don't cut it short"

      - id: ball_shielding
        name: "Ball Protection"
        description: "Keep body between ball and defender"
        phase: spin
        joints: [left_hip, right_hip, left_shoulder, right_shoulder]
        metric_type: body_angle
        ideal_value: 90
        threshold_good: 70
        threshold_acceptable: 50
        weight: 0.25
        feedback:
          good: "Excellent ball shielding!"
          acceptable: "Good protection, keep your body more between ball and defender"
          poor: "Shield the ball better - use your body as a barrier"

      - id: balance
        name: "Core Stability"
        description: "Maintain low center of gravity throughout"
        phase: spin
        joints: [left_knee, right_knee]
        metric_type: angle
        ideal_value: 35
        threshold_good: 40
        threshold_acceptable: 50
        weight: 0.25
        feedback:
          good: "Great balance and stability!"
          acceptable: "Stay lower during the spin"
          poor: "Bend your knees more - stay compact"

      - id: fluidity
        name: "Smooth Transition"
        description: "Both feet work together seamlessly"
        phase: [first_touch, second_touch]
        joints: [left_ankle, right_ankle]
        metric_type: motion_continuity
        ideal_value: 1.0
        threshold_good: 0.8
        threshold_acceptable: 0.6
        weight: 0.15
        feedback:
          good: "Silky smooth execution!"
          acceptable: "Good flow, work on the transition between feet"
          poor: "Make it one fluid motion - both feet should work together"

  rainbow_flick:
    name: "Rainbow Flick"
    description: "Flick the ball over your head and the defender"
    difficulty: advanced
    dominant_foot: right
    player_id: neymar
    video_url: "skills/rainbow_flick_reference.mp4"
    thumbnail_url: "skills/rainbow_flick_thumb.jpg"
    origin_story: "Neymar has made the rainbow flick his party piece, humiliating defenders with this audacious skill."

    phases:
      - name: setup
        description: "Position ball between feet"
      - name: roll_up
        description: "Roll ball up back of standing leg"
      - name: flick
        description: "Flick ball over head with heel"
      - name: collection
        description: "Collect ball on other side"

    key_joints:
      - left_ankle
      - right_ankle
      - left_heel
      - right_heel
      - left_hip
      - right_hip

    checkpoints:
      - id: ball_roll
        name: "Ball Roll Control"
        description: "Smooth roll up the back of the leg"
        phase: roll_up
        joints: [left_ankle, left_heel]
        metric_type: trajectory_smoothness
        ideal_value: 1.0
        threshold_good: 0.8
        threshold_acceptable: 0.6
        weight: 0.3
        feedback:
          good: "Perfect ball roll!"
          acceptable: "Good roll, work on making it smoother"
          poor: "Control the roll - don't let the ball bounce"

      - id: flick_height
        name: "Flick Arc"
        description: "Ball should arc over head at good height"
        phase: flick
        joints: [right_heel]
        metric_type: velocity_magnitude
        ideal_value: 5.0
        threshold_good: 4.0
        threshold_acceptable: 3.0
        weight: 0.35
        feedback:
          good: "Beautiful arc over the head!"
          acceptable: "Good height, try to get more lift"
          poor: "Flick harder - the ball needs to clear your head"

      - id: timing
        name: "Movement Timing"
        description: "All phases flow together seamlessly"
        phase: [setup, roll_up, flick]
        joints: [left_ankle, right_ankle]
        metric_type: motion_continuity
        ideal_value: 1.0
        threshold_good: 0.8
        threshold_acceptable: 0.6
        weight: 0.35
        feedback:
          good: "Perfect timing!"
          acceptable: "Good flow, work on the rhythm"
          poor: "Practice the timing - it should be one fluid motion"

  la_croqueta:
    name: "La Croqueta"
    description: "Quick lateral ball shift from one foot to the other"
    difficulty: beginner
    dominant_foot: right
    player_id: messi
    video_url: "skills/la_croqueta_reference.mp4"
    thumbnail_url: "skills/la_croqueta_thumb.jpg"
