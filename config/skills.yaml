    phases:
      - name: approach
        description: "Running with ball"
      - name: shift
        description: "Quick lateral pass to other foot"
      - name: acceleration
        description: "Burst past defender"

    key_joints:
      - left_ankle
      - right_ankle
      - left_hip
      - right_hip

    checkpoints:
      - id: shift_speed
        name: "Shift Speed"
        description: "Quick lateral movement of the ball"
        phase: shift
        joints: [left_ankle, right_ankle]
        metric_type: velocity_change
        ideal_value: 3.0
        threshold_good: 2.5
        threshold_acceptable: 2.0
        weight: 0.4
        feedback:
          good: "Lightning quick shift!"
          acceptable: "Good speed, try to be even quicker"
          poor: "Shift the ball faster - catch the defender off guard"

      - id: body_position
        name: "Body Angle"
        description: "Body should move with the ball"
        phase: shift
        joints: [left_hip, right_hip]
        metric_type: direction_change
        ideal_value: 45
        threshold_good: 35
        threshold_acceptable: 25
        weight: 0.3
        feedback:
          good: "Great body coordination!"
          acceptable: "Move your body more with the ball"
          poor: "Your whole body needs to shift - not just the ball"

      - id: close_control
        name: "Ball Proximity"
        description: "Keep ball close during the shift"
        phase: shift
        joints: [left_ankle, right_ankle]
        metric_type: distance
        ideal_value: 0.2
        threshold_good: 0.3
        threshold_acceptable: 0.4
        weight: 0.3
        feedback:
          good: "Excellent close control!"
          acceptable: "Keep the ball closer to your feet"
          poor: "The ball is too far - keep it tight"

  chop:
    name: "The Chop"
    description: "Sharp cut behind standing leg to change direction"
    difficulty: beginner
    dominant_foot: right
    player_id: mbappe
    video_url: "skills/chop_reference.mp4"
    thumbnail_url: "skills/chop_thumb.jpg"
    origin_story: "A fundamental skill, Mbappe uses the chop at high speed to devastating effect."

    phases:
      - name: approach
        description: "Running at pace"
      - name: plant
        description: "Plant standing foot"
      - name: cut
        description: "Chop ball behind standing leg"
      - name: exit
        description: "Accelerate in new direction"

    key_joints:
      - left_ankle
      - right_ankle
      - left_knee
      - right_knee

    checkpoints:
      - id: cut_angle
        name: "Cut Sharpness"
        description: "Ball should change direction sharply"
        phase: cut
        joints: [right_ankle]
        metric_type: direction_angle
        ideal_value: 90
        threshold_good: 75
        threshold_acceptable: 60
        weight: 0.35
        feedback:
          good: "Sharp cut!"
          acceptable: "Good angle, try to make it sharper"
          poor: "Cut more sharply - change direction completely"

      - id: plant_stability
        name: "Plant Foot Stability"
        description: "Standing foot should be firm and balanced"
        phase: plant
        joints: [left_ankle, left_knee]
        metric_type: stability
        ideal_value: 1.0
        threshold_good: 0.8
        threshold_acceptable: 0.6
        weight: 0.3
        feedback:
          good: "Rock solid plant foot!"
          acceptable: "Good base, work on stability"
          poor: "Plant your foot more firmly before cutting"

      - id: exit_speed
        name: "Acceleration"
        description: "Quick burst after the cut"
        phase: exit
        joints: [left_hip, right_hip]
        metric_type: velocity_change
        ideal_value: 2.5
        threshold_good: 2.0
        threshold_acceptable: 1.5
        weight: 0.35
        feedback:
          good: "Explosive acceleration!"
          acceptable: "Good exit, accelerate faster"
          poor: "Burst away after the cut - don't slow down"

  sombrero:
    name: "Sombrero Flick"
    description: "Chip the ball over an incoming opponent"
    difficulty: advanced
    dominant_foot: right
    player_id: ronaldinho
    video_url: "skills/sombrero_reference.mp4"
    thumbnail_url: "skills/sombrero_thumb.jpg"
    origin_story: "Ronaldinho perfected the art of chipping the ball over defenders with joy and flair."

    phases:
      - name: approach
        description: "Defender approaching"
      - name: scoop
        description: "Scoop ball upward"
      - name: dodge
        description: "Move around defender"
      - name: collection
        description: "Collect ball on other side"

    key_joints:
      - right_ankle
      - right_foot_index
      - left_hip
      - right_hip

    checkpoints:
      - id: scoop_technique
        name: "Scoop Contact"
        description: "Get under the ball properly"
        phase: scoop
        joints: [right_ankle, right_foot_index]
        metric_type: angle
        ideal_value: 45
        threshold_good: 40
        threshold_acceptable: 30
        weight: 0.35
        feedback:
          good: "Perfect scoop technique!"
          acceptable: "Good contact, get more under the ball"
          poor: "Get your foot under the ball to lift it properly"

      - id: ball_height
        name: "Lift Height"
        description: "Ball should clear the opponent"
        phase: scoop
        joints: [right_foot_index]
        metric_type: velocity_magnitude
        ideal_value: 4.0
        threshold_good: 3.5
        threshold_acceptable: 3.0
        weight: 0.35
        feedback:
          good: "Great height on the chip!"
          acceptable: "Good lift, try to get more height"
          poor: "Lift the ball higher - it needs to clear the defender"

      - id: movement
        name: "Body Movement"
        description: "Quick movement around the defender"
        phase: dodge
        joints: [left_hip, right_hip]
        metric_type: velocity_change
        ideal_value: 2.0
        threshold_good: 1.5
        threshold_acceptable: 1.0
        weight: 0.3
        feedback:
          good: "Quick movement around!"
          acceptable: "Good movement, be quicker"
          poor: "Move faster around the defender"

  heel_chop:
    name: "Heel Chop"
    description: "Use heel to knock ball behind standing leg"
    difficulty: intermediate
    dominant_foot: right
    player_id: maradona
    video_url: "skills/heel_chop_reference.mp4"
    thumbnail_url: "skills/heel_chop_thumb.jpg"
    origin_story: "Maradona used this deceptive heel touch to wrong-foot defenders in tight spaces."

    phases:
      - name: approach
        description: "Running with ball"
      - name: plant
        description: "Plant standing foot"
      - name: heel_touch
        description: "Heel chop behind standing leg"
      - name: turn
        description: "Turn and accelerate"

    key_joints:
      - right_heel
      - right_ankle
      - left_ankle
      - left_hip
      - right_hip

    checkpoints:
      - id: heel_contact
        name: "Heel Touch"
        description: "Clean contact with heel"
        phase: heel_touch
        joints: [right_heel]
        metric_type: contact_quality
        ideal_value: 1.0
        threshold_good: 0.8
        threshold_acceptable: 0.6
        weight: 0.35
        feedback:
          good: "Clean heel contact!"
          acceptable: "Good touch, make it cleaner"
          poor: "Use your heel more precisely"

      - id: direction_change
        name: "Direction Change"
        description: "Ball changes direction sharply"
        phase: heel_touch
        joints: [right_heel, right_ankle]
        metric_type: direction_angle
        ideal_value: 120
        threshold_good: 100
        threshold_acceptable: 80
        weight: 0.35
        feedback:
          good: "Sharp direction change!"
          acceptable: "Good angle, make it sharper"
          poor: "Change direction more dramatically"

      - id: body_turn
        name: "Body Rotation"
        description: "Turn body to follow the ball"
        phase: turn
        joints: [left_hip, right_hip]
        metric_type: rotation_angle
        ideal_value: 180
        threshold_good: 150
        threshold_acceptable: 120
        weight: 0.3
        feedback:
          good: "Smooth body turn!"
          acceptable: "Good turn, rotate more fully"
          poor: "Turn your body completely to follow the ball"

