[project]
name = "skill-lab"
version = "0.1.0"
description = "Video keyframes to inspectable SAM 3D Body meshes"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20",
  "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "trimesh>=4.6,<5",
  "pillow>=11,<13", "httpx>=0.28,<1", "fal-client>=0.12,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
